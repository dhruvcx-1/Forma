services:
  forma-db-init:
    image: ${FORMA_IMAGE:-ghcr.io/dhruvcx-1/forma:latest}
    command: ["/usr/local/bin/forma-backend", "--init-db"]
    restart: "no"
    environment:
      DATABASE_PATH: /app/data/body-tracker.db
      PHOTOS_PATH: /app/data/photos
    volumes:
      - forma_data:/app/data

  forma:
    image: ${FORMA_IMAGE:-ghcr.io/dhruvcx-1/forma:latest}
    pull_policy: always
    container_name: forma
    restart: unless-stopped
    depends_on:
      forma-db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      EXTERNAL_PORT: "3001"
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in your .env file}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DATABASE_PATH: /app/data/body-tracker.db
      PHOTOS_PATH: /app/data/photos
      CORS_ORIGIN: ${PUBLIC_URL:-}
      FORMA_AI_ENCRYPTION_KEY: ${FORMA_AI_ENCRYPTION_KEY:-}
      FORMA_AI_ALLOW_HTTP_BASE_URL: ${FORMA_AI_ALLOW_HTTP_BASE_URL:-false}
    ports:
      - "${EXTERNAL_PORT:-3001}:3001"
    expose:
      - "3001"
    volumes:
      - forma_data:/app/data
    networks:
      - reverse-proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.routers.forma.rule=Host(`${FORMA_DOMAIN:?Set FORMA_DOMAIN in your .env file}`)
      - traefik.http.routers.forma.entrypoints=websecure
      - traefik.http.routers.forma.tls=true
      - traefik.http.routers.forma.tls.certresolver=cloudflare
      - traefik.http.routers.forma.service=forma
      - traefik.http.services.forma.loadbalancer.server.port=3001

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true

volumes:
  forma_data:
    name: forma_data
