services:
  forma:
    # Build the Flutter Web frontend and API from this checkout. Do not pull :latest.
    image: forma:flutter-local
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: forma
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      EXTERNAL_PORT: "3001"
      # Set COOKIE_SECRET in .env; do not commit the production signing secret.
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in your .env file}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DATABASE_PATH: /app/data/body-tracker.db
      PHOTOS_PATH: /app/data/photos
      CORS_ORIGIN: https://forma.deshmesh.com
    # Direct host access for clients and API integration: http://HOST:3001/api
    ports:
      - "${EXTERNAL_PORT:-3001}:3001"
    expose:
      - "3001"
    volumes:
      - forma_data:/app/data
    networks:
      - reverse-proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.routers.forma.rule=Host(`forma.deshmesh.com`)
      - traefik.http.routers.forma.entrypoints=websecure
      - traefik.http.routers.forma.tls=true
      - traefik.http.routers.forma.tls.certresolver=cloudflare
      - traefik.http.routers.forma.service=forma
      - traefik.http.services.forma.loadbalancer.server.port=3001

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true

volumes:
  forma_data:
    name: forma_data
