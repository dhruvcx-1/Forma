name: Publish Forma release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/forma

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORMA_ANDROID_KEYSTORE_BASE64: ${{ secrets.FORMA_ANDROID_KEYSTORE_BASE64 }}
      FORMA_ANDROID_STORE_PASSWORD: ${{ secrets.FORMA_ANDROID_STORE_PASSWORD }}
      FORMA_ANDROID_KEY_ALIAS: ${{ secrets.FORMA_ANDROID_KEY_ALIAS }}
      FORMA_ANDROID_KEY_PASSWORD: ${{ secrets.FORMA_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install Flutter dependencies
        working-directory: packages/flutter_app
        run: flutter pub get --enforce-lockfile

      - name: Validate Android signing secrets
        shell: bash
        run: |
          for value in "$FORMA_ANDROID_KEYSTORE_BASE64" "$FORMA_ANDROID_STORE_PASSWORD" "$FORMA_ANDROID_KEY_ALIAS" "$FORMA_ANDROID_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "Configure all four Android signing secrets before creating a release."
              exit 1
            fi
          done

      - name: Decode Android signing key
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/forma-release.jks"
          printf '%s' "$FORMA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "FORMA_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: packages/flutter_app
        run: flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "$GITHUB_RUN_NUMBER"

      - name: Name APK
        working-directory: packages/flutter_app
        run: cp build/app/outputs/flutter-apk/app-release.apk "Forma-Android-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to version release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Forma ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: packages/flutter_app/Forma-Android-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true

  build-and-push-docker:
    name: Build and push Rust server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture Rust server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
