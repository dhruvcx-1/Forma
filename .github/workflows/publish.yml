name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
      - "feature/*"
      - feature/public-profiles-and-avatars
    tags:
      - "v*.*.*"
  schedule:
    # Nightly build every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/forma

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Commit SHA tag
            type=sha,prefix=sha-,format=short
            # Version semver tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Production latest tag on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Nightly tag for feature branches and scheduled nightly builds
            type=raw,value=nightly,enable=${{ startsWith(github.ref, 'refs/heads/feature/') || github.event_name == 'schedule' }}
            # Branch name tag (e.g. :feature-public-profiles-and-avatars)
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Verify published image
        run: |
          echo "Published image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Image digest: ${{ steps.meta.outputs.digest }}"
          echo ""
          echo "Pull with:"
          echo "  docker pull ghcr.io/${{ env.IMAGE_NAME }}:nightly"
          echo "  docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest"
