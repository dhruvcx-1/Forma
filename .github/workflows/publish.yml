name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
      - "feature/*"
      - feature/public-profiles-and-avatars
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/forma

jobs:
  validate:
    name: Validate backend, React, and Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test backend
        run: npm test --workspace=packages/backend

      - name: Build backend
        run: npm run build --workspace=packages/backend

      - name: Test React frontend
        run: npm test --workspace=packages/frontend

      - name: Build React frontend
        run: npm run build --workspace=packages/frontend

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install Flutter dependencies
        working-directory: packages/flutter_app
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter app
        working-directory: packages/flutter_app
        run: flutter analyze

      - name: Test Flutter app
        working-directory: packages/flutter_app
        run: flutter test

      - name: Build Flutter Web
        working-directory: packages/flutter_app
        run: flutter build web --release

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install Flutter dependencies
        working-directory: packages/flutter_app
        run: flutter pub get --enforce-lockfile

      - name: Build installable Android APK
        working-directory: packages/flutter_app
        run: flutter build apk --release --dart-define=FORMA_API_BASE_URL=https://forma.deshmesh.com

      - name: Name APK
        working-directory: packages/flutter_app
        run: cp build/app/outputs/flutter-apk/app-release.apk "Forma-Android-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forma-android-${{ github.sha }}
          path: packages/flutter_app/Forma-Android-*.apk
          if-no-files-found: error
          retention-days: 30

  publish-android-release:
    name: Attach APK to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: forma-android-${{ github.sha }}

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Forma-Android-*.apk

  build-and-push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Commit SHA tag
            type=sha,prefix=sha-,format=short
            # Version semver tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Production latest tag on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Nightly tag for feature branches (built only when new commits are pushed)
            type=raw,value=nightly,enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}
            # Branch name tag (e.g. :feature-public-profiles-and-avatars)
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Verify published image
        run: |
          echo "Published image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Image digest: ${{ steps.meta.outputs.digest }}"
          echo ""
          echo "Pull with:"
          echo "  docker pull ghcr.io/${{ env.IMAGE_NAME }}:nightly"
          echo "  docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest"
