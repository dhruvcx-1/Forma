name: Build and Publish Rust Beta Images

on:
  push:
    branches:
      - rust-dev-beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish-beta:
    name: Build and publish Rust beta image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish beta Rust backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rust
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/forma-beta:latest
            ghcr.io/${{ github.repository_owner }}/forma-beta:sha-${{ github.sha }}
          cache-from: type=gha,scope=forma-rust-beta
          cache-to: type=gha,mode=max,scope=forma-rust-beta
